<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Nebula Studio | Portfolio</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f1a;
  color: white;
  overflow-x: hidden;
}

/* 🌌 звёзды */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

/* 🔝 верх */
.topbar {
  width: 100%;
  padding: 20px;
  display: flex;
  justify-content: center;
  position: fixed;
  top: 0;
  left: 0;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
  z-index: 10;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  color: white;
  text-decoration: none;
  transition: 0.3s;
}

.logo:hover {
  color: #a855f7;
  transform: scale(1.1);
}

/* 📦 контент */
.container {
  position: relative;
  z-index: 2;
  padding-top: 110px;
  text-align: center;
}

h1 { font-size: 40px; }
p { opacity: 0.7; }

/* 🧱 карточки */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 40px;
}

.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 15px;
  cursor: pointer;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-10px) scale(1.03);
  background: rgba(255,255,255,0.1);
}

/* 🪟 модалка */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.75);
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.modal-content {
  background: #1a1a2e;
  padding: 25px;
  border-radius: 15px;
  width: 80%;
  max-width: 600px;
  animation: pop 0.3s ease;
  text-align: center;
}

@keyframes pop {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.close {
  float: right;
  cursor: pointer;
  font-size: 20px;
}

.media {
  display: grid;
  gap: 10px;
  margin-top: 15px;
}

.media img,
.media video {
  width: 100%;
  border-radius: 10px;
}
</style>
</head>

<body>

<!-- 🌌 звёзды -->
<canvas id="stars"></canvas>

<!-- 🔝 меню -->
<div class="topbar">
  <a class="logo" href="index.html">Nebula Studio</a>
</div>

<!-- 📦 сайт -->
<div class="container">

<h1>Наше портфолио</h1>
<p>Лучшие работы нашей студии</p>

<div class="grid">

  <div class="card" onclick="openModal('models')">
    <h3>3D Модели</h3>
  </div>

  <div class="card" onclick="openModal('editing')">
    <h3>Монтаж</h3>
  </div>

  <div class="card">
    <h3>Датапаки</h3>
  </div>

  <div class="card">
    <h3>Сайты</h3>
  </div>

</div>

</div>

<!-- 🪟 модальное окно -->
<div id="modal" class="modal">
  <div class="modal-content">

    <span class="close" onclick="closeModal()">✖</span>

    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>

  </div>
</div>

<script>
/* 🌌 звёзды */
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = [];

for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2,
    speed: Math.random() * 0.5 + 0.2
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "white";

  for (let s of stars) {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();

    s.y += s.speed;

    if (s.y > canvas.height) {
      s.y = 0;
      s.x = Math.random() * canvas.width;
    }
  }

  requestAnimationFrame(draw);
}

draw();

/* 🪟 логика окон */
function openModal(type) {
  const modal = document.getElementById("modal");
  const title = document.getElementById("modal-title");
  const body = document.getElementById("modal-body");

  modal.style.display = "flex";

  if (type === "models") {
    title.innerText = "3D Модели";

    body.innerHTML = `
      <div class="media">
        <img src="https://via.placeholder.com/500x300?text=Model+1">
        <img src="https://via.placeholder.com/500x300?text=Model+2">
        <img src="https://via.placeholder.com/500x300?text=Model+3">
      </div>
    `;
  }

  if (type === "editing") {
    title.innerText = "Монтаж";

    body.innerHTML = `
      <div class="media">
        <video controls>
          <source src="https://www.w3schools.com/html/mov_bbb.mp4">
        </video>

        <video controls>
          <source src="https://www.w3schools.com/html/movie.mp4">
        </video>
      </div>
    `;
  }
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
