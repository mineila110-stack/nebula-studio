<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Nebula Studio | Portfolio</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f1a;
    color: white;
    overflow-x: hidden;
  }

  /* 🌌 фон звёзды */
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
  }

  /* 🔝 верхняя панель */
  .topbar {
    width: 100%;
    padding: 20px;
    display: flex;
    justify-content: center;
    position: fixed;
    top: 0;
    left: 0;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    z-index: 10;
  }

  .logo {
    font-size: 22px;
    font-weight: bold;
    color: white;
    text-decoration: none;
    transition: 0.3s;
  }

  .logo:hover {
    color: #a855f7;
    transform: scale(1.1);
  }

  /* 📦 контент */
  .container {
    position: relative;
    z-index: 2;
    padding-top: 110px;
    text-align: center;
  }

  h1 { font-size: 40px; }
  p { opacity: 0.7; }

  /* 🧱 карточки */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 40px;
  }

  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 15px;
    cursor: pointer;
    transition: 0.3s;
  }

  .card:hover {
    transform: translateY(-10px) scale(1.03);
    background: rgba(255,255,255,0.1);
  }

  /* 📂 блоки */
  .expand {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: all 0.6s ease;
    background: rgba(255,255,255,0.05);
    margin: 0 40px;
    border-radius: 15px;
  }

  .expand.active {
    max-height: 500px;
    opacity: 1;
    padding: 20px;
    margin-top: 20px;
  }

  .images {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .img {
    flex: 1;
    min-width: 150px;
    padding: 20px;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
  }
</style>
</head>

<body>

<!-- 🌌 звёзды -->
<canvas id="stars"></canvas>

<!-- 🔝 меню -->
<div class="topbar">
  <a class="logo" href="index.html">Nebula Studio</a>
</div>

<!-- 📦 контент -->
<div class="container">

  <h1>Наше портфолио</h1>
  <p>Лучшие работы нашей студии</p>

  <div class="grid">

    <div class="card" onclick="toggleSection('models')">
      <h3>3D Модели</h3>
    </div>

    <div class="card" onclick="toggleSection('editing')">
      <h3>Монтаж</h3>
    </div>

    <div class="card" onclick="toggleSection('datapacks')">
      <h3>Датапаки</h3>
    </div>

    <div class="card" onclick="toggleSection('sites')">
      <h3>Сайты</h3>
    </div>

  </div>

  <!-- 📂 блоки -->
  <div id="models" class="expand">
    <h2>3D Модели</h2>
    <p> 
      <img src="https://cdn.discordapp.com/attachments/1508526110067916870/1513142239063445606/image.png?ex=6a294a06&is=6a27f886&hm=4c4214f0084eec66ffdc70ab924a2493ef730c72689e54c01e8f9940ace72055&" alt="Sorcerer Hat - Шляпа волшебника">
      <img src="https://cdn.discordapp.com/attachments/1402225101419708449/1513936689574183022/image.png?ex=6a298aea&is=6a28396a&hm=c7e91fcffe7f8dc0ecb3963387d7ea42fb5dcaba3e877f0e1e8188e2ab5bc6cb&" alt="Virelame-Malkarion's sword">
    </p>
  </div>

  <div id="editing" class="expand">
    <h2>Монтаж</h2>
    <p>Скоро эдиты...</p>
  </div>

  <div id="datapacks" class="expand">
    <h2>Датапаки</h2>
    <p>Скоро механики...</p>
  </div>

  <div id="sites" class="expand">
    <h2>Сайты</h2>
    <p>Скоро веб-проекты...</p>
  </div>

</div>

<script>
/* 🌌 звёзды */
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = [];

for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2,
    speed: Math.random() * 0.5 + 0.2
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "white";

  for (let s of stars) {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();

    s.y += s.speed;

    if (s.y > canvas.height) {
      s.y = 0;
      s.x = Math.random() * canvas.width;
    }
  }

  requestAnimationFrame(draw);
}

draw();

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

/* 🧠 переключение блоков */
function toggleSection(id) {
  const sections = document.querySelectorAll(".expand");

  sections.forEach(el => {
    if (el.id !== id) {
      el.classList.remove("active");
    }
  });

  document.getElementById(id).classList.toggle("active");
}
</script>

</body>
</html>
