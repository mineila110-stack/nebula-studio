<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Nebula Studio | Portfolio</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f1a;
  color: white;
  overflow-x: hidden;
}

/* 🌌 звёзды */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

/* 🔝 верх */
.topbar {
  width: 100%;
  padding: 20px;
  display: flex;
  justify-content: center;
  position: fixed;
  top: 0;
  left: 0;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
  z-index: 10;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  color: white;
  text-decoration: none;
}

/* 📦 контент */
.container {
  position: relative;
  z-index: 2;
  padding-top: 110px;
  text-align: center;
}

h1 { font-size: 40px; }

/* карточки */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 40px;
}

.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 15px;
  cursor: pointer;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-10px) scale(1.03);
  background: rgba(255,255,255,0.1);
}

/* 📦 раскрытие снизу */
.expand {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: 0.5s ease;
  margin: 0 40px;
  background: rgba(255,255,255,0.05);
  border-radius: 15px;
  padding: 0 20px;
}

.expand.active {
  max-height: 600px;
  opacity: 1;
  padding: 20px;
}

/* медиа */
.media img,
.media video {
  width: 100%;
  border-radius: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="topbar">
  <a class="logo" href="index.html">Nebula Studio</a>
</div>

<div class="container">

<h1>Наше портфолио</h1>

<div class="grid">

  <div class="card" onclick="toggle('models')">
    <h3>3D Модели</h3>
  </div>

  <div class="card" onclick="toggle('editing')">
    <h3>Монтаж</h3>
  </div>

</div>

<!-- 📦 3D -->
<div id="models" class="expand">
  <h2>3D Модели</h2>
  <div class="media">
    <img src="https://via.placeholder.com/500x300?text=Model+1">
    <img src="https://via.placeholder.com/500x300?text=Model+2">
  </div>
</div>

<!-- 🎬 монтаж -->
<div id="editing" class="expand">
  <h2>Монтаж</h2>
  <div class="media">
    <video controls>
      <source src="https://www.w3schools.com/html/mov_bbb.mp4">
    </video>
  </div>
</div>

</div>

<script>
/* 🌌 звёзды */
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = [];

for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2,
    speed: Math.random() * 0.5 + 0.2
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "white";

  for (let s of stars) {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();

    s.y += s.speed;
    if (s.y > canvas.height) {
      s.y = 0;
      s.x = Math.random() * canvas.width;
    }
  }

  requestAnimationFrame(draw);
}

draw();

/* 📦 переключение */
function toggle(id) {
  const blocks = document.querySelectorAll(".expand");

  blocks.forEach(b => {
    if (b.id !== id) b.classList.remove("active");
  });

  document.getElementById(id).classList.toggle("active");
}
</script>

</body>
</html>
